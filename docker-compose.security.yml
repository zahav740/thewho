version: '3.8'

services:
  # PostgreSQL Database с улучшенной безопасностью
  postgres:
    image: postgres:15-alpine
    container_name: production_crm_db_secure
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # Дополнительные настройки безопасности PostgreSQL
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-local=md5 --auth-host=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - crm_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    # Безопасность: база данных НЕ доступна извне
    # ports НЕ указаны намеренно
    security_opt:
      - no-new-privileges:true
    read_only: false  # PostgreSQL нужна запись
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/run/postgresql:noexec,nosuid,size=100m

  # Redis для кэширования и сессий
  redis:
    image: redis:7-alpine
    container_name: production_crm_redis_secure
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 300
      --timeout 0
      --tcp-backlog 511
      --databases 16
    volumes:
      - redis_data:/data
    networks:
      - crm_internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m

  # Backend NestJS API с максимальной безопасностью
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.security
    container_name: production_crm_backend_secure
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Настройки безопасности
      BCRYPT_ROUNDS: 12
      MAX_LOGIN_ATTEMPTS: 5
      LOCKOUT_TIME: 900000  # 15 минут
      SESSION_TIMEOUT: 3600000  # 1 час
    volumes:
      - ./uploads:/app/uploads:rw,noexec,nosuid
      - ./logs:/app/logs:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_internal_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    security_opt:
      - no-new-privileges:true
    read_only: false  # NestJS нужна запись для логов
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    # Внутренний порт НЕ экспонируется наружу
    user: "1001:1001"  # Не root пользователь

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.security
      args:
        REACT_APP_API_URL: /api
        REACT_APP_ENVIRONMENT: production
    container_name: production_crm_frontend_secure
    volumes:
      - ./logs:/var/log/nginx:rw
    depends_on:
      - backend
    networks:
      - crm_internal_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /var/cache/nginx:noexec,nosuid,size=50m
      - /var/run:noexec,nosuid,size=50m
    user: "101:101"  # nginx пользователь

  # Nginx Reverse Proxy с SSL
  nginx:
    image: nginx:1.25-alpine
    container_name: production_crm_nginx_secure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-security.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs:/var/log/nginx:rw
    depends_on:
      - frontend
      - backend
    networks:
      - crm_internal_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /var/cache/nginx:noexec,nosuid,size=50m
      - /var/run:noexec,nosuid,size=50m

  # Мониторинг безопасности с Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: production_crm_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - crm_internal_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # Порт НЕ экспонируется наружу для безопасности

  # Fail2ban для защиты от брутфорса
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: production_crm_fail2ban
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fail2ban:/data
      - ./logs:/var/log:ro
    environment:
      TZ: "Europe/Moscow"
      F2B_LOG_LEVEL: INFO
      F2B_LOG_TARGET: STDOUT
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/docker/volumes/postgres_data
  redis_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  crm_internal_network:
    driver: bridge
    internal: false  # Нужен доступ в интернет для обновлений
    ipam:
      config:
        - subnet: 172.20.0.0/16
