version: '3.8'

services:
  # Backend NestJS API с подключением к Supabase
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.security
    container_name: kasuf_crm_backend_supabase
    environment:
      NODE_ENV: production
      PORT: 3000
      
      # Supabase Database Connection
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL_MODE: ${DB_SSL_MODE}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT}
      DB_TIMEOUT: ${DB_TIMEOUT}
      
      # Supabase Configuration
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      
      # JWT Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      
      # API Configuration
      CORS_ORIGIN: ${CORS_ORIGIN}
      
      # Security Settings
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS}
      LOCKOUT_TIME: ${LOCKOUT_TIME}
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      API_SECRET_KEY: ${API_SECRET_KEY}
      
      # Rate Limiting
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      
      # Monitoring
      ENABLE_PROMETHEUS: ${ENABLE_PROMETHEUS}
      LOG_LEVEL: ${LOG_LEVEL}
      ENABLE_AUDIT_LOG: ${ENABLE_AUDIT_LOG}
    
    volumes:
      - ./uploads:/app/uploads:rw,noexec,nosuid
      - ./logs:/app/logs:rw
    
    networks:
      - crm_network
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    
    security_opt:
      - no-new-privileges:true
    
    # НЕ экспонируем порт наружу - только через Nginx
    user: "1001:1001"

  # Redis для кэширования и сессий (опционально)
  redis:
    image: redis:7-alpine
    container_name: kasuf_crm_redis
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.security
      args:
        REACT_APP_API_URL: /api
        REACT_APP_ENVIRONMENT: production
    container_name: kasuf_crm_frontend
    volumes:
      - ./logs:/var/log/nginx:rw
    depends_on:
      - backend
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /var/cache/nginx:noexec,nosuid,size=50m
      - /var/run:noexec,nosuid,size=50m
    user: "101:101"

  # Nginx Reverse Proxy с SSL
  nginx:
    image: nginx:1.25-alpine
    container_name: kasuf_crm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-security.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs:/var/log/nginx:rw
    depends_on:
      - frontend
      - backend
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /var/cache/nginx:noexec,nosuid,size=50m
      - /var/run:noexec,nosuid,size=50m

  # Мониторинг с Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: kasuf_crm_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - crm_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # Порт НЕ экспонируется наружу для безопасности

  # Fail2ban для защиты от брутфорса
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: kasuf_crm_fail2ban
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fail2ban:/data
      - ./logs:/var/log:ro
    environment:
      TZ: "Europe/Moscow"
      F2B_LOG_LEVEL: INFO
      F2B_LOG_TARGET: STDOUT
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  crm_network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Примечания для Supabase:
# 1. Не нужен локальный PostgreSQL контейнер - используем Supabase
# 2. Redis опционален - можно отключить если не используется
# 3. Убедитесь что правильно настроены переменные DB_* для Supabase
# 4. Проверьте что Supabase настроен для подключений извне
