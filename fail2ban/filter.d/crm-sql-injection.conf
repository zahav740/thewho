# Фильтр для обнаружения SQL инъекций
[Definition]
failregex = ^<HOST>.*(\%27)|(\')|(\-\-)|(\%23)|(#).*$
            ^<HOST>.*((\%3D)|(=))[^\n]*((\%27)|(\')|(\-\-)|(\%3B)|(;)).*$
            ^<HOST>.*\w*((\%27)|(\'))((\%6F)|o|(\%4F))((\%72)|r|(\%52)).*$
            ^<HOST>.*((\%27)|(\'))union.*$
            ^<HOST>.*exec(\s|\+)+(s|x)p\w+.*$
            ^<HOST>.*union(.|\n)*select.*$
            ^<HOST>.*select(.|\n)*from.*$
            ^<HOST>.*insert(.|\n)*into.*$
            ^<HOST>.*delete(.|\n)*from.*$
            ^<HOST>.*update(.|\n)*set.*$
            ^<HOST>.*drop(.|\n)*table.*$
            ^<HOST>.*create(.|\n)*table.*$
            ^<HOST>.*alter(.|\n)*table.*$

ignoreregex = 

datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
