# Фильтр для обнаружения XSS атак
[Definition]
failregex = ^<HOST>.*<script[^>]*>.*</script>.*$
            ^<HOST>.*<iframe[^>]*>.*</iframe>.*$
            ^<HOST>.*<object[^>]*>.*</object>.*$
            ^<HOST>.*<embed[^>]*>.*</embed>.*$
            ^<HOST>.*javascript:.*$
            ^<HOST>.*vbscript:.*$
            ^<HOST>.*onload=.*$
            ^<HOST>.*onerror=.*$
            ^<HOST>.*onclick=.*$
            ^<HOST>.*onmouseover=.*$
            ^<HOST>.*eval\(.*$
            ^<HOST>.*expression\(.*$

ignoreregex = 

datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
