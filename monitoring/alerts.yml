groups:
  - name: crm_security_alerts
    rules:
      # Высокий уровень неудачных попыток входа
      - alert: HighFailedLoginAttempts
        expr: increase(crm_security_events_total{event_type="FAILED_LOGIN"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Высокий уровень неудачных попыток входа"
          description: "Обнаружено {{ $value }} неудачных попыток входа за последние 5 минут"

      # SQL инъекции
      - alert: SQLInjectionAttempt
        expr: increase(crm_security_events_total{event_type="SQL_INJECTION_ATTEMPT"}[1m]) > 0
        for: 0m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "🚨 КРИТИЧЕСКИ ВАЖНО: Попытка SQL инъекции"
          description: "Обнаружена попытка SQL инъекции: {{ $value }} попыток"

      # XSS атаки
      - alert: XSSAttempt
        expr: increase(crm_security_events_total{event_type="XSS_ATTEMPT"}[1m]) > 0
        for: 0m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "🚨 КРИТИЧЕСКИ ВАЖНО: Попытка XSS атаки"
          description: "Обнаружена попытка XSS атаки: {{ $value }} попыток"

      # Подозрительная активность
      - alert: SuspiciousActivity
        expr: increase(crm_security_events_total{event_type="SUSPICIOUS_ACTIVITY"}[10m]) > 5
        for: 1m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Подозрительная активность"
          description: "Обнаружено {{ $value }} подозрительных событий за последние 10 минут"

      # Превышение лимита запросов
      - alert: RateLimitExceeded
        expr: increase(crm_security_events_total{event_type="RATE_LIMIT_EXCEEDED"}[5m]) > 20
        for: 2m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Множественные превышения лимита запросов"
          description: "{{ $value }} превышений лимита за последние 5 минут"

  - name: crm_application_alerts
    rules:
      # Высокое использование CPU
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Высокое использование CPU"
          description: "CPU использование: {{ $value }}%"

      # Высокое использование памяти
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / process_virtual_memory_max_bytes) * 100 > 90
        for: 3m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Высокое использование памяти"
          description: "Память использована на {{ $value }}%"

      # Медленные запросы к базе данных
      - alert: SlowDatabaseQueries
        expr: avg(crm_db_query_duration_seconds) > 2
        for: 2m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Медленные запросы к базе данных"
          description: "Среднее время выполнения запроса: {{ $value }}s"

      # Ошибки HTTP 5xx
      - alert: HighServerErrorRate
        expr: (sum(rate(crm_http_requests_total{status=~"5.."}[5m])) / sum(rate(crm_http_requests_total[5m]))) * 100 > 5
        for: 2m
        labels:
          severity: critical
          category: application
        annotations:
          summary: "Высокий уровень серверных ошибок"
          description: "{{ $value }}% запросов завершились ошибкой 5xx"

      # Ошибки HTTP 4xx
      - alert: HighClientErrorRate
        expr: (sum(rate(crm_http_requests_total{status=~"4.."}[5m])) / sum(rate(crm_http_requests_total[5m]))) * 100 > 15
        for: 5m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "Высокий уровень клиентских ошибок"
          description: "{{ $value }}% запросов завершились ошибкой 4xx"

  - name: crm_infrastructure_alerts
    rules:
      # База данных недоступна
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "🚨 База данных недоступна"
          description: "PostgreSQL база данных не отвечает"

      # Redis недоступен
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "🚨 Redis недоступен"
          description: "Redis кэш не отвечает"

      # Backend недоступен
      - alert: BackendDown
        expr: up{job="crm-backend"} == 0
        for: 30s
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "🚨 Backend приложение недоступно"
          description: "CRM Backend не отвечает"

      # Frontend недоступен
      - alert: FrontendDown
        expr: up{job="crm-frontend"} == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "🚨 Frontend приложение недоступно"
          description: "CRM Frontend не отвечает"

      # Высокая нагрузка на диск
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"}) / node_filesystem_size_bytes{fstype!="tmpfs"} * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Высокое использование диска"
          description: "Диск заполнен на {{ $value }}%"

      # Мало свободной памяти
      - alert: LowMemoryAvailable
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 3m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Мало доступной памяти"
          description: "Доступно только {{ $value }}% памяти"

  - name: crm_business_alerts
    rules:
      # Нет новых пользователей
      - alert: NoNewUsers
        expr: increase(crm_users_registered_total[1h]) == 0
        for: 2h
        labels:
          severity: info
          category: business
        annotations:
          summary: "Нет новых регистраций пользователей"
          description: "За последние 2 часа не было новых регистраций"

      # Низкая активность пользователей
      - alert: LowUserActivity
        expr: avg_over_time(crm_active_users[1h]) < 5
        for: 1h
        labels:
          severity: info
          category: business
        annotations:
          summary: "Низкая активность пользователей"
          description: "Средняя активность пользователей: {{ $value }}"

      # Много отклоненных заказов
      - alert: HighOrderRejectionRate
        expr: (sum(rate(crm_orders_total{status="rejected"}[1h])) / sum(rate(crm_orders_total[1h]))) * 100 > 10
        for: 30m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Высокий процент отклоненных заказов"
          description: "{{ $value }}% заказов отклонено за последний час"

  - name: crm_backup_alerts
    rules:
      # Резервное копирование не выполнялось
      - alert: BackupFailed
        expr: time() - crm_last_successful_backup_timestamp > 86400
        for: 0m
        labels:
          severity: critical
          category: backup
        annotations:
          summary: "🚨 Резервное копирование не выполнялось"
          description: "Последнее успешное резервное копирование: {{ $value | humanizeTimestamp }}"

      # Размер резервной копии слишком мал
      - alert: BackupSizeTooSmall
        expr: crm_backup_size_bytes < 1048576  # Меньше 1MB
        for: 0m
        labels:
          severity: warning
          category: backup
        annotations:
          summary: "Подозрительно маленький размер резервной копии"
          description: "Размер последней резервной копии: {{ $value | humanize1024 }}B"
