server {
    listen 80;
    server_name kasuf.xyz www.kasuf.xyz;
    
    # Принудительное перенаправление на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kasuf.xyz www.kasuf.xyz;
    
    # SSL Конфигурация
    ssl_certificate /etc/letsencrypt/live/kasuf.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasuf.xyz/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Современные SSL протоколы и шифры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; child-src 'none'; frame-src 'none'; worker-src 'none'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; manifest-src 'self';" always;
    
    # Скрыть версию nginx
    server_tokens off;
    
    # Ограничения размера запросов
    client_max_body_size 50M;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    
    # Таймауты
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s 5s;
    send_timeout 10s;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    
    # Блокировка подозрительных User-Agent
    if ($http_user_agent ~* (nmap|nikto|wikto|sf|sqlmap|bsqlbf|w3af|acunetix|havij|appscan)) {
        return 444;
    }
    
    # Блокировка SQL инъекций в URL
    if ($request_uri ~* "(union|select|insert|delete|update|drop|create|alter|execute|script|javascript|vbscript)" ) {
        return 444;
    }
    
    # Основное приложение (Frontend)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Защита от clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Кеширование статических ресурсов
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }
    
    # API Backend с дополнительной защитой
    location /api/ {
        # Rate limiting для API
        limit_req zone=api burst=50 nodelay;
        limit_conn perip 10;
        
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Дополнительные заголовки безопасности для API
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        
        # Таймауты для API
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Специальная защита для endpoints аутентификации
    location /api/auth/ {
        # Строгое ограничение для входа
        limit_req zone=login burst=10 nodelay;
        limit_conn perip 3;
        
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Блокировка доступа к служебным файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ^/(\.user.ini|\.htaccess|\.htpasswd|\.ssh|\.bash_history|\.mysql_history) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Блокировка админских путей WordPress (на всякий случай)
    location ~ ^/(wp-admin|wp-login|xmlrpc) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Загрузка файлов с дополнительной проверкой
    location /api/uploads/ {
        limit_req zone=api burst=10 nodelay;
        
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ограничения для загрузки файлов
        client_max_body_size 50M;
    }
    
    # Логирование безопасности
    access_log /var/log/nginx/kasuf_xyz_access.log combined;
    error_log /var/log/nginx/kasuf_xyz_error.log warn;
}

# Блокировка IP адресов (добавьте сюда подозрительные IP)
geo $blocked_ip {
    default 0;
    # 1.2.3.4 1;  # Пример блокировки IP
}

# Если IP заблокирован, возвращаем 444
map $blocked_ip $block {
    1 1;
    0 0;
}

server {
    if ($block) {
        return 444;
    }
}
